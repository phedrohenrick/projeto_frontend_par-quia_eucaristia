<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f0">
  <title>Primeira Eucaristia 2026 · Paróquia Nossa Senhora Rosa Mística</title>
  <meta name="description" content="Veja e baixe as fotos da Primeira Eucaristia 2026 da Paróquia Nossa Senhora Rosa Mística.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Primeira Eucaristia 2026">
  <meta property="og:description" content="Paróquia Nossa Senhora Rosa Mística · Veja e baixe as fotos.">
  <meta property="og:image" content="/assets/capa-900.jpg">
  <link rel="icon" href="/assets/logo-paroquia.png">
  <link rel="apple-touch-icon" href="/assets/logo-paroquia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero">
    <div class="logos">
      <img class="logo-paroquia" src="/assets/logo-paroquia.png" alt="Brasão da Paróquia Nossa Senhora Rosa Mística" width="97" height="122">
      <img class="logo-pascom" src="/assets/logo-pascom.png" alt="Pascom Rosa Mística" width="281" height="92">
    </div>

    <div class="title">
      <h1>Primeira Eucaristia</h1>
      <p class="parish">Paróquia Nossa Senhora Rosa Mística</p>
      <p class="year"><span>2026</span></p>
    </div>

    <picture class="cover">
      <source media="(max-width: 700px)" srcset="/assets/capa-900.jpg">
      <img src="/assets/capa.jpg" alt="Crianças da Primeira Eucaristia reunidas no altar com o padre" width="1600" height="1200" fetchpriority="high">
    </picture>

    <div class="hero-actions">
      <p id="count" class="count"></p>
      <a id="folder-link" class="btn" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>
        Baixar todas as fotos
      </a>
    </div>
  </header>

  <nav id="sections-nav" class="sections-nav" aria-label="Sessões de fotos" hidden></nav>

  <main id="gallery">
    <p id="status" class="status" role="status">Carregando fotos…</p>
  </main>

  <footer class="foot">
    <p>Toque em uma foto para ampliar e baixar em qualidade original.</p>
    <p class="credit">Fotos: Pascom Rosa Mística</p>
  </footer>

  <dialog id="viewer" class="viewer" aria-label="Visualizar foto">
    <div class="viewer-top">
      <span id="viewer-counter"></span>
      <div class="viewer-tools">
        <a id="viewer-download" class="btn btn-light" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>
          Baixar
        </a>
        <button id="viewer-close" class="icon-btn" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="viewer-stage">
      <button id="viewer-prev" class="icon-btn nav prev" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <img id="viewer-img" alt="">
      <button id="viewer-next" class="icon-btn nav next" aria-label="Próxima foto">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <p class="viewer-hint">Deslize para o lado para ver a próxima</p>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
